        <g transform="rotate(22.5)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(45)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(67.5)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(90)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(112.5)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(135)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(157.5)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(180)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(202.5)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(225)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(247.5)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(270)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(292.5)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(315)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(337.5)"><rect x="-5" y="-72" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>

        <!-- Outer ring of 24 points -->
        <g transform="rotate(0)"><rect x="-6" y="-92" width="12" height="12" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(15)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(30)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(45)"><rect x="-6" y="-92" width="12" height="12" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(60)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(75)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(90)"><rect x="-6" y="-92" width="12" height="12" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(105)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(120)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(135)"><rect x="-6" y="-92" width="12" height="12" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(150)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(165)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(180)"><rect x="-6" y="-92" width="12" height="12" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(195)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(210)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(225)"><rect x="-6" y="-92" width="12" height="12" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(240)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(255)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(270)"><rect x="-6" y="-92" width="12" height="12" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(285)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(300)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(315)"><rect x="-6" y="-92" width="12" height="12" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(330)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(345)"><rect x="-5" y="-90" width="10" height="10" transform="rotate(45)" fill="#FFFFFF"/></g>

        <!-- 8 outer accent tips -->
        <g transform="rotate(0)"><rect x="-4" y="-108" width="8" height="8" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(45)"><rect x="-4" y="-108" width="8" height="8" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(90)"><rect x="-4" y="-108" width="8" height="8" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(135)"><rect x="-4" y="-108" width="8" height="8" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(180)"><rect x="-4" y="-108" width="8" height="8" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(225)"><rect x="-4" y="-108" width="8" height="8" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(270)"><rect x="-4" y="-108" width="8" height="8" transform="rotate(45)" fill="#FFFFFF"/></g>
        <g transform="rotate(315)"><rect x="-4" y="-108" width="8" height="8" transform="rotate(45)" fill="#FFFFFF"/></g>
      </g>
    </g>

    <!-- Bottom: المملكة العربية السعودية (Arabic) -->
    <text x="500" y="370" font-family="'IBM Plex Sans Arabic', Tahoma, sans-serif" font-size="34" font-weight="500" text-anchor="middle" fill="#FFFFFF" letter-spacing="1">المملكة العربية السعودية</text>

    <!-- Bottom: KINGDOM OF SAUDI ARABIA (English) -->
    <text x="500" y="420" font-family="'Inter', Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#FFFFFF" letter-spacing="9">KINGDOM OF SAUDI ARABIA</text>
